name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch/PR cancels the previous run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            preset: linux
            artifact: build/AlmenEMU
            artifact_name: AlmenEMU-linux-x86_64
            run_cmd: ./build/AlmenEMU --help
          - name: Windows x86_64
            os: windows-2022
            preset: windows
            artifact: build/Release/AlmenEMU.exe
            artifact_name: AlmenEMU-windows-x86_64
            run_cmd: ./build/Release/AlmenEMU.exe --help
          - name: macOS arm64
            # macos-14 (Sonoma) is fully unsupported since Nov 2026.
            # macos-15 is the current stable image and runs on Apple Silicon.
            os: macos-15
            preset: macos
            artifact: build/AlmenEMU
            artifact_name: AlmenEMU-macos-arm64
            run_cmd: ./build/AlmenEMU --help

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxss-dev libxtst-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libgl1-mesa-dev libglx-dev libegl1-mesa-dev libgles2-mesa-dev \
            libvulkan-dev

      - name: Install Ninja on macOS
        if: runner.os == 'macOS'
        run: brew install ninja

      # SDL3 and ImGui are pinned in CMakeLists.txt. They are cloned into deps/
      # and restored from the cache, so CMake never re-downloads ~110 MB per run
      # (FETCHCONTENT_SOURCE_DIR_* makes FetchContent skip the download step).
      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: deps
          key: ${{ runner.os }}-deps-v1-${{ hashFiles('CMakeLists.txt') }}

      - name: Populate dependencies
        shell: bash
        run: |
          mkdir -p deps
          if [ ! -f deps/sdl3/.populated ]; then
            git clone --depth 1 --branch release-3.4.20 \
              https://github.com/libsdl-org/SDL.git deps/sdl3
            touch deps/sdl3/.populated
          fi
          if [ ! -f deps/imgui/.populated ]; then
            git clone --depth 1 --branch v1.93.0 \
              https://github.com/ocornut/imgui.git deps/imgui
            touch deps/imgui/.populated
          fi

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }} -DALMENEMU_BUILD_TESTS=ON
          -DFETCHCONTENT_SOURCE_DIR_SDL3=${{ github.workspace }}/deps/sdl3
          -DFETCHCONTENT_SOURCE_DIR_IMGUI=${{ github.workspace }}/deps/imgui

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test (headless host tests)
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Smoke test (--help)
        shell: bash
        run: ${{ matrix.run_cmd }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
